# Supported UCB-based Policy Learning schema template. This file is intentionally
# NOT runnable as checked in: replace every REPLACE_ME value and provide the
# external environment dependency factory before using `python -m agentpilot.app run`.
# Semantic identities and thresholds must match the calibration bundle supplied
# by the environment adapter.

[policy]
method = "ucb"
base_seed = 17
direction_slate_size = 4
discover_quota = 2
max_slot_generation_attempts = 2
# How many existing arms a DISCOVER slot is shown so it can avoid them. The
# semantic gate rejects a collision with any of them, so the proposer has to be
# able to see them.
discover_exclusion_limit = 12
# Whole-slate replacements one logical round may spend before the batch is
# declared planning-exhausted and the campaign starts a replacement batch.
max_planning_attempts = 3

[policy.proposer]
provider = "REPLACE_ME-provider"
model = "REPLACE_ME-model"
max_output_tokens = 4096
temperature = 0.3
disable_reasoning = false
max_proposer_turns = 6
max_trace_reads = 3
max_repository_reads = 3
max_read_bytes = 24576
max_scope_refs = 8
max_new_paths = 4

[policy.cooldown]
max_slot_generation_failures = 2
slot_generation_cooldown_opportunities = 3
max_retryable_skips = 2
skip_cooldown_opportunities = 2

[policy.effectiveness]
statistic = "lower_bound"

[policy.neighborhood]
exploration_c = 1.0
min_observations = 3
fallback_levels = ["exact", "global"]
solver_tolerance = 1e-8
solver_max_iterations = 100
tie_tolerance = 1e-12

[policy.semantic]
provider = "REPLACE_ME-embedding-provider"
model = "REPLACE_ME/embedding-model"
# Stable human-readable id of the loaded calibration/acceptance bundle.
calibration_bundle_id = "REPLACE_ME-calibration-bundle"
encoder_identity = "REPLACE_ME-encoder-release"
# Replace this with the exact output dimension of the chosen embedding model.
dimension = 1536
metric = "cosine"
threshold_id = "REPLACE_ME-threshold-set"
tau_repeat = 0.08
tau_arm = 0.22
# Abstain when a distance is this close to either identity threshold.
threshold_boundary_margin = 0.005
# Only decides whether two nearest arms are effectively tied.
nearest_arm_tie_tolerance = 1e-12

[runtime]
# Paths are resolved relative to this TOML. The parent directories must exist
# before runtime assembly; change these when copying the template elsewhere.
database_path = "../runs/ucb.sqlite3"
runs_root = "../runs/ucb"
worker_slots = 2
sqlite_timeout_seconds = 30.0
lease_ttl_seconds = 120.0
lease_renew_interval_seconds = 30.0
# Set this to true only when the adapter supplies authoritative per-request
# cost data. Runs with false must not be used for cost claims.
require_provider_reported_cost = false

[campaign]
# Used only by the optional `agentpilot campaign` command. Increase these values
# after measuring the concurrency and cost of your adapter.
total_processes = 1
actions_per_process = 1
max_planning_batches_per_process = 3
# Consecutive resumes allowed to make no durable progress before the campaign
# stops rather than looping on the same interruption.
max_stalled_resumes = 3
poll_interval_seconds = 30.0
# Maximum wait for authoritative provider accounting.
reconciliation_deadline_seconds = 1800.0

[environment]
# This callable must return AssemblyDependencies. It owns provider clients,
# durable search inputs, paired evaluation, and the action runner.
factory = "REPLACE_ME.environment:create_dependencies"
identity = "REPLACE_ME-environment"

[environment.settings]
# Opaque adapter-owned settings; replace this table for the real integration.
adapter_config = "REPLACE_ME"
