# Frozen from deepseek-harness-runtime-bin==0.1.0rc6. The SDK's
# launch_args_override disables its default Cordis injection, so the DSH
# adapter copies this template into each run-private DSH home, freezes the
# role-configured bash-local timeoutMs/maxTimeoutMs there, and supplies the
# sandbox-valid guest path explicitly through DSH_CORDIS_CONFIG.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
