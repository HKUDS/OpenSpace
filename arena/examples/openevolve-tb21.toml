# Public formal openevolve x Terminal-Bench 2.1 experiment (10 candidates).
# Relative runtime paths are documented in README.md.

[benchmark_runtime.inner_agent]
ref = "builtin:terminus-2"

[baseline]
cwd = "."
candidate_root = "."

[baseline.env]

[baseline.config]
development_concurrency = 16
candidate_path = "src/harbor/agents/terminus_2/terminus_2.py"

[baseline.config.native]
max_iterations = 9
checkpoint_interval = 1
random_seed = 42
language = "python"
file_suffix = ".py"
diff_based_evolution = true
max_code_length = 400000
max_tasks_per_child = 1
log_level = "INFO"

[baseline.config.native.llm]
api_base = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
temperature = 0.7
max_tokens = 32000
timeout = 600
retries = 0
retry_delay = 5
random_seed = 42
reasoning_effort = "high"
models = [{ name = "deepseek/deepseek-v4-pro-0813", provider = "openai", weight = 1.0 }]

[baseline.config.native.prompt]
system_message = "Improve only the frozen Terminus 2 candidate file. Preserve its public interfaces and native agent loop. Use Arena A feedback as development material; Arena B score is the only selection fitness. If Arena feedback reports a candidate runtime failure, repair it before generating another candidate; never resubmit unchanged code. Return a focused SEARCH/REPLACE diff."
num_top_programs = 1
num_diverse_programs = 0
use_template_stochasticity = true
include_artifacts = true
max_artifact_bytes = 72000
artifact_security_filter = true
suggest_simplification_after_chars = 200000
diff_summary_max_line_len = 100
diff_summary_max_lines = 30

[baseline.config.native.database]
in_memory = true
log_prompts = true
population_size = 32
archive_size = 32
num_islands = 1
random_seed = 42
feature_dimensions = ["complexity", "diversity"]
feature_bins = 10

[baseline.config.native.evaluator]
timeout = 50881
max_retries = 0
cascade_evaluation = false
parallel_evaluations = 1
distributed = false
use_llm_feedback = false
enable_artifacts = true

[baseline.config.native.evolution_trace]
enabled = true
format = "jsonl"
include_code = false
include_prompts = true
buffer_size = 1
compress = false

